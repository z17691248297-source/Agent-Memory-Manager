name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: git diff --check
      - run: bash scripts/reproduce_all.sh --smoke
      - run: |
          ! grep -R "47\.108\|/home/vip\|api_key: EMPTY" configs docs README.md agentmem scripts tests
